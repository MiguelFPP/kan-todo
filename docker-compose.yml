services:
  postgres:
    image: postgres:15-alpine
    container_name: kan-todo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-kan_todo}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3.0
    container_name: kan-todo-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=${S3_REGION:-us-east-1}
      - DEBUG=1
      - DISABLE_EVENTS=1
      - ACTIVATE_PRO=0
    volumes:
      - "./infra/localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kan-todo-api
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      - PORT=${PORT:-4000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-kan_todo}?schema=public
      - S3_ENDPOINT=${S3_ENDPOINT:-http://localstack:4566}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-test}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-test}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-kan-todo-bucket}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      - postgres
      - localstack

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: kan-todo-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
